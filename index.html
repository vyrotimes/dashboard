<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VyroTimes - Dashboard</title>
  
  <!-- Custom Logo Favicon -->
  <link rel="icon" type="image/png" href="https://vyrotimes.github.io/dashboard/logo.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <iframe 
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycbw9V9MPEDbqMY-HcAMIsTWB9ozPORsTiGbPhxJToXYrWd7WkCq4tw8Z30hFZFaGoyqW2Q/exec" 
    allow="payment">
  </iframe>

  <script>
    (function() {
      var outerRef = document.referrer || "Direct";
      var frame = document.getElementById("app-frame");
      if (frame) {
        var baseUrl = "https://script.google.com/macros/s/AKfycbw9V9MPEDbqMY-HcAMIsTWB9ozPORsTiGbPhxJToXYrWd7WkCq4tw8Z30hFZFaGoyqW2Q/exec";
        frame.src = baseUrl + "?ref=" + encodeURIComponent(outerRef);
      }
    })();
  </script>

</body>
</html>
