<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer-when-downgrade">
  
  <!-- SEO Title & Meta Description -->
  <title>VyroTimes - The Fastest Way to Get Engagement</title>
  <meta name="description" content="VyroTimes provides Views, Subscribers, Followers and Likes on all platforms to help you reach your social media goals. 100% money-back guarantee. 100% premium quality services. 100% real people, no bots.">
  <meta name="keywords" content="VyroTimes, social media growth, engagement, buy views, subscribers, followers, likes">
  <meta name="robots" content="index, follow">

  <!-- Open Graph for Social Media Previews -->
  <meta property="og:title" content="VyroTimes - The Fastest Way to Get Engagement">
  <meta property="og:description" content="VyroTimes provides Views, Subscribers, Followers and Likes on all platforms to help you reach your social media goals. 100% money-back guarantee. 100% premium quality services. 100% real people, no bots.">
  <meta property="og:image" content="https://vyrotimes.github.io/dashboard/logo.png">
  <meta property="og:url" content="https://vyrotimes.com/">
  <meta property="og:type" content="website">

  <!-- Custom Logo Favicon -->
  <link rel="icon" type="image/png" href="https://vyrotimes.github.io/dashboard/logo.png">

  <!-- JSON-LD Structured Data for Google Rich Snippets -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "VyroTimes",
    "operatingSystem": "All",
    "applicationCategory": "BusinessApplication",
    "offers": {
      "@type": "Offer",
      "price": "0.00",
      "priceCurrency": "USD"
    },
    "description": "VyroTimes provides Views, Subscribers, Followers and Likes on all platforms to help you reach your social media goals. 100% money-back guarantee. 100% premium quality services. 100% real people, no bots."
  }
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8fafc;
    }
    .spinner-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f8fafc;
      z-index: 10;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid #cbd5e1;
      border-top-color: #0f172a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      opacity: 0;
      transition: opacity 0.25s ease-in-out;
    }
    iframe.loaded {
      opacity: 1;
    }
    .seo-fallback {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Hidden text readable by search crawlers -->
  <div class="seo-fallback">
    <h1>VyroTimes - The Fastest Way to Get Engagement</h1>
    <p>VyroTimes provides Views, Subscribers, Followers and Likes on all platforms to help you reach your social media goals. 100% money-back guarantee. 100% premium quality services. 100% real people, no bots.</p>
  </div>

  <div id="loader" class="spinner-container">
    <div class="spinner"></div>
  </div>

  <script>
    (function() {
      var outerRef = document.referrer;
      
      if (!outerRef || outerRef === "") {
        var urlParams = new URLSearchParams(window.location.search);
        outerRef = urlParams.get('utm_source') || urlParams.get('ref') || "Direct";
      }

      var baseUrl = "https://script.google.com/macros/s/AKfycbw9V9MPEDbqMY-HcAMIsTWB9ozPORsTiGbPhxJToXYrWd7WkCq4tw8Z30hFZFaGoyqW2Q/exec";
      var finalUrl = baseUrl + "?ref=" + encodeURIComponent(outerRef);

      var iframe = document.createElement("iframe");
      iframe.id = "app-frame";
      iframe.setAttribute("allow", "payment");
      iframe.src = finalUrl;

      iframe.onload = function() {
        var loader = document.getElementById("loader");
        if (loader) loader.style.display = "none";
        iframe.classList.add("loaded");
      };

      document.body.appendChild(iframe);
    })();
  </script>

</body>
</html>
