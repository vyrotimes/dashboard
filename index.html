<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer-when-downgrade">
  <title>VyroTimes - Dashboard</title>
  
  <!-- Custom Logo Favicon -->
  <link rel="icon" type="image/png" href="https://vyrotimes.github.io/dashboard/logo.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8fafc;
    }
    .spinner-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      background-color: #f8fafc;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid #cbd5e1;
      border-top-color: #0f172a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      opacity: 0;
      transition: opacity 0.25s ease-in-out;
    }
    iframe.loaded {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div id="loader" class="spinner-container">
    <div class="spinner"></div>
  </div>

  <script>
    (function() {
      var outerRef = document.referrer;
      
      if (!outerRef || outerRef === "") {
        var urlParams = new URLSearchParams(window.location.search);
        outerRef = urlParams.get('utm_source') || urlParams.get('ref') || "Direct";
      }

      var baseUrl = "https://script.google.com/macros/s/AKfycbw9V9MPEDbqMY-HcAMIsTWB9ozPORsTiGbPhxJToXYrWd7WkCq4tw8Z30hFZFaGoyqW2Q/exec";
      var finalUrl = baseUrl + "?ref=" + encodeURIComponent(outerRef);

      var iframe = document.createElement("iframe");
      iframe.id = "app-frame";
      iframe.setAttribute("allow", "payment");
      iframe.src = finalUrl;

      iframe.onload = function() {
        var loader = document.getElementById("loader");
        if (loader) loader.style.display = "none";
        iframe.classList.add("loaded");
      };

      document.body.appendChild(iframe);
    })();
  </script>

</body>
</html>
