<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer-when-downgrade">
  <title>VyroTimes - Dashboard</title>
  
  <!-- Custom Logo Favicon -->
  <link rel="icon" type="image/png" href="https://vyrotimes.github.io/dashboard/logo.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <script>
    (function() {
      var outerRef = document.referrer;
      
      if (!outerRef || outerRef === "") {
        var urlParams = new URLSearchParams(window.location.search);
        outerRef = urlParams.get('utm_source') || urlParams.get('ref') || "Direct";
      }

      var baseUrl = "https://script.google.com/macros/s/AKfycbw9V9MPEDbqMY-HcAMIsTWB9ozPORsTiGbPhxJToXYrWd7WkCq4tw8Z30hFZFaGoyqW2Q/exec";
      var finalUrl = baseUrl + "?ref=" + encodeURIComponent(outerRef);

      var iframe = document.createElement("iframe");
      iframe.id = "app-frame";
      iframe.setAttribute("allow", "payment");
      iframe.src = finalUrl;
      document.body.appendChild(iframe);
    })();
  </script>

</body>
</html>
